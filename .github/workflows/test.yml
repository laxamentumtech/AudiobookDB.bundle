name: tests

on:
  push:
    branches: [develop, "feature/*", "feat/*"]
  pull_request:

jobs:
  python3:
    name: py3 (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run suite
        run: make test

  python2:
    name: py2 (python:2.7-slim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run suite
        run: make test-py2
